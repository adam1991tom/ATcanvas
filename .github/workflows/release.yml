name: AT Canvas Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.3.4'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server branch
        uses: actions/checkout@v4
        with:
          ref: server
          path: server-src

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            V="${{ github.event.inputs.version }}"
          else
            V="$(tr -d '[:space:]' < server-src/VERSION)"
          fi
          V="${V#v}"
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Package server
        shell: bash
        run: |
          tar -C server-src -czf "at-canvas-server-v${{ steps.version.outputs.version }}.tar.gz" server docker docker-compose.yml .env.example README.md docs

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish server image
        uses: docker/build-push-action@v6
        with:
          context: server-src
          file: server-src/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/at-canvas-server:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/at-canvas-server:latest

      - name: Create release notes
        shell: bash
        run: |
          SERVER_SHA=$(git -C server-src rev-parse --short HEAD)
          cat > release-notes.md <<EOF
          # AT Canvas v${{ steps.version.outputs.version }}

          AT Canvas now uses a browser-only display model.

          - Server branch: \`server\` (${SERVER_SHA})
          - Server Docker image: \`ghcr.io/${{ github.repository_owner }}/at-canvas-server:${{ steps.version.outputs.version }}\`
          - Server package: \`at-canvas-server-v${{ steps.version.outputs.version }}.tar.gz\`
          - Displays use permanent URLs served by the AT Canvas server. No display client package is required.
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GH_REPO" "at-canvas-server-v${{ steps.version.outputs.version }}.tar.gz" --clobber
          else
            gh release create "$TAG" --repo "$GH_REPO" "at-canvas-server-v${{ steps.version.outputs.version }}.tar.gz" --target main --title "AT Canvas v${{ steps.version.outputs.version }}" --notes-file release-notes.md
          fi
