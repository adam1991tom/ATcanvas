services:
  at-canvas:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: at-canvas
    restart: unless-stopped
    ports:
      - "${AT_CANVAS_PORT:-8077}:8077"
    environment:
      AT_CANVAS_DB: ${AT_CANVAS_DB:-/data/at-canvas.db}
      AT_CANVAS_VERSION: "0.6.1"
      AT_CANVAS_ADMIN_TITLE: ${AT_CANVAS_ADMIN_TITLE:-AT Canvas}
      AT_CANVAS_ADMIN_USER: ${AT_CANVAS_ADMIN_USER:-admin}
      AT_CANVAS_ADMIN_PASSWORD: ${AT_CANVAS_ADMIN_PASSWORD:?Set AT_CANVAS_ADMIN_PASSWORD in .env}
      TZ: Europe/London
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro

  at-canvas-https:
    image: nginx:alpine
    container_name: at-canvas-https
    restart: unless-stopped
    profiles: ["https"]
    depends_on:
      - at-canvas
    ports:
      - "${AT_CANVAS_HTTPS_PORT:-8078}:443"
    volumes:
      - ./docker/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certs:/etc/nginx/certs:ro
      - /etc/localtime:/etc/localtime:ro
