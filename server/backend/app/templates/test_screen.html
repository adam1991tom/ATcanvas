<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ name }}</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;width:100%;height:100%;background:#050608;color:#f4f7fb;font-family:system-ui;display:grid;place-items:center;overflow:hidden;cursor:none}
.box{text-align:center}
.name{font-size:clamp(28px,5vw,56px);font-weight:850;margin-bottom:10px}
.muted{color:#8290a0;font-size:18px}
</style>
</head>
<body>
<div class="box">
<div class="name">{{ name }}</div>
<div class="muted" id="clock"></div>
</div>
<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleString('en-GB',{hour12:false})}
tick();setInterval(tick,1000);
</script>
</body>
</html>
